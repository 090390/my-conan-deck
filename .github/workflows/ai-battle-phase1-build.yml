name: AI battle phase-one build

on:
  push:
    branches:
      - feature/ai-battle-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate machine-readable card effects
        run: npm run validate:card-effects
      - name: Build production bundle
        run: npm run build
